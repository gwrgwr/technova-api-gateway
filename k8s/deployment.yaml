apiVersion: apps/v1
kind: Deployment
metadata:
  name: technova-api-gateway
  namespace: technova
  labels:
    app: technova-api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: technova-api-gateway
  template:
    metadata:
      labels:
        app: technova-api-gateway
    spec:
      containers:
        - name: technova-api-gateway
          image: gwrgwr/technova-api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: MONGODB_URI_API_GATEWAY
              value: "mongodb+srv://murilomassa72:t0SnsRhgENyGcKG9@technova.dvmjo4p.mongodb.net/technova-api-gateway?retryWrites=true&w=majority&appName=Technova"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: RABBITMQ_USER
              value: "admin"
            - name: RABBITMQ_PASS
              value: "admin"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
          volumeMounts:
            - name: jwt-public-key-volume
              mountPath: /app/keys/public.pem
              subPath: public.pem
            - name: jwt-private-key-volume
              mountPath: /app/keys/key.pem
              subPath: key.pem
      volumes:
        - name: jwt-public-key-volume
          configMap:
            name: jwt-public-key
            items:
              - key: public.pem
                path: public.pem
        - name: jwt-private-key-volume
          secret:
            secretName: jwt-private-key
