apiVersion: v1
kind: Pod
metadata:
  name: api-gateway
  namespace: jenkins
spec:
  containers:
    - name: api-gateway
      image: gwrgwr/murilo.ramos:api-gateway-latest
      ports:
        - containerPort: 8080
      volumeMounts:
        - name: jwt-public-key-volume
          mountPath: /app/keys/public.pem
          subPath: public.pem
        - name: jwt-private-key-volume
          mountPath: /app/keys/key.pem
          subPath: key.pem
      env:
        - name: MONGODB_URI_API_GATEWAY
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: MONGODB_URI_API_GATEWAY
  imagePullSecrets:
    - name: dockerhub-credentials
  volumes:
    - name: jwt-public-key-volume
      configMap:
        name: jwt-public-key
        items:
          - key: public.pem
            path: public.pem
    - name: jwt-private-key-volume
      secret:
        secretName: jwt-private-key
        items:
          - key: key.pem
            path: key.pem
